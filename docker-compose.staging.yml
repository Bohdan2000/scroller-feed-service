networks:
  scroller-net:
    external: true

services:
  feed:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: feed_service
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
      PORT: 3004
    ports:
      - "3004:3004"
    networks:
      - scroller-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/api/v1/health 2>/dev/null || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
